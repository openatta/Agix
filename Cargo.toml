[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/model",
    "crates/auth",
    "crates/hooks",
    "crates/plugin",
    "crates/plugin-host",
    "crates/script-host",
    "crates/wasm-host",
    "crates/plugin-compiler",
    "crates/telemetry",
    "crates/history",
    "crates/permissions",
    "crates/mcp",
    "crates/tools",
    "crates/skills",
    "crates/runtime",
    "crates/compaction",
    "crates/session",
    "crates/scene",
    "crates/team",
    "crates/task",
    "daemon",
    "tests/rpc_client",
    "tests/daemon_harness",
    "tests/runner",
    "tests/fixtures/mcp_toy_server",
]

[workspace.package]
version = "0.2.9-2026103001"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false
authors = ["Agix contributors"]
repository = "https://github.com/openatta/agix"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
eventsource-stream = "0.2"
bytes = "1"
url = "2"

# WebSocket
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
unicode-normalization = "0.1"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Common
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
jsonschema = { version = "0.49", default-features = false }
# QuickJS bindings — the script carrier's engine. See crates/script-host.
rquickjs = { version = "0.12", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
regex = "1"
glob = "0.3"
globset = "0.4"
html2text = "0.6"
which = "7"
similar = "2"
base64 = "0.22"
ignore = "0.4"
walkdir = "2"
tiktoken-rs = "0.6"
toml = "0.8"
bs58 = "0.5"
async-stream = "0.3"

# MCP
rmcp = { version = "1.6", features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
# The process wrapper rmcp spawns stdio servers through; named directly so a
# server can lead its own process group.
process-wrap = { version = "9", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }

# Dev
tempfile = "3"
notify = "6"

# Internal crate dependencies
base     = { path = "crates/core" }
model    = { path = "crates/model" }
auth     = { path = "crates/auth" }
hooks    = { path = "crates/hooks" }
plugin   = { path = "crates/plugin" }
# `default-features = false` has to live here rather than on the members:
# a member that inherits a workspace dependency cannot turn its defaults off,
# so writing it there is silently ignored — which is how the daemon ended up
# linking the WebAssembly compiler it was supposed to be built without.
plugin-host = { path = "crates/plugin-host", default-features = false }
wasm-host = { path = "crates/wasm-host", default-features = false }
script-host = { path = "crates/script-host" }
telemetry = { path = "crates/telemetry" }
history  = { path = "crates/history" }
permissions = { path = "crates/permissions" }
mcp      = { path = "crates/mcp" }
tools    = { path = "crates/tools" }
skills   = { path = "crates/skills" }
runtime    = { path = "crates/runtime" }
compaction = { path = "crates/compaction" }
session    = { path = "crates/session" }
scene      = { path = "crates/scene" }
team       = { path = "crates/team" }
task       = { path = "crates/task" }
daemon     = { path = "daemon" }
rpc-client = { path = "tests/rpc_client" }
daemon-harness = { path = "tests/daemon_harness" }

# The release artifact was 54 MB of which 14 MB was symbols nobody ships and
# reads, and the rest was compiled without any cross-crate inlining. Three
# lines take it to 33 MB and cost about fifteen seconds of build time.
#
# `panic` is deliberately left at `unwind`. Aborting would be smaller and
# faster, and it would also mean a panic inside one tool takes the whole
# daemon down with every session on it — `spawn_blocking` join errors are
# handled in several places precisely because that is not the wanted outcome.
#
# `lto` is `thin` rather than `fat` on purpose: fat reaches 30.6 MB and nearly
# doubles the build, which is a poor trade for 2.4 MB on a profile people
# build locally.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
