[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/model",
    "crates/hooks",
    "crates/plugin",
    "crates/script-host",
    "crates/ptc",
    "crates/telemetry",
    "crates/history",
    "crates/permissions",
    "crates/mcp",
    "crates/tools",
    "crates/skills",
    "crates/runtime",
    "crates/compaction",
    "crates/session",
    "crates/scene",
    "crates/team",
    "crates/agents",
    "crates/assembly",
    "daemon",
    "tests/rpc_client",
    "tests/live",
    "tests/runner",
    "tests/fixtures/mcp_toy_server",
    "tests/fixtures/mcp_oauth_mock",
    "examples/plugins/rust",
]

[workspace.package]
version = "0.3.10-2026110901"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
authors = ["Agix contributors"]
repository = "https://github.com/openatta/agix"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "parking_lot", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
eventsource-stream = "0.2"
bytes = "1"
url = "2"

# WebSocket
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
unicode-normalization = "0.1"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Common
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
jsonschema = { version = "0.49", default-features = false }
# QuickJS bindings — the script carrier's engine. See crates/script-host.
rquickjs = { version = "0.12", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
regex = "1"
globset = "0.4"
html2text = "0.6"
which = "7"
similar = "2"
base64 = "0.22"
ignore = "0.4"
toml = "0.8"
bs58 = "0.5"
async-stream = "0.3"

# MCP
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "auth", "auth-client-credentials-jwt", "auth-enterprise-managed"] }
# The process wrapper rmcp spawns stdio servers through; named directly so a
# server can lead its own process group.
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }

# Dev
tempfile = "3"
notify = "6"

# Internal crate dependencies
base     = { path = "crates/core" }
platform = { path = "crates/platform" }
demo-rust-plugin = { path = "examples/plugins/rust" }
model    = { path = "crates/model" }
hooks    = { path = "crates/hooks" }
plugin   = { path = "crates/plugin" }
script-host = { path = "crates/script-host" }
ptc = { path = "crates/ptc" }
telemetry = { path = "crates/telemetry" }
history  = { path = "crates/history" }
permissions = { path = "crates/permissions" }
mcp      = { path = "crates/mcp" }
tools    = { path = "crates/tools", default-features = false }
skills   = { path = "crates/skills" }
runtime    = { path = "crates/runtime", default-features = false }
compaction = { path = "crates/compaction" }
session    = { path = "crates/session" }
scene      = { path = "crates/scene" }
team       = { path = "crates/team" }
agents     = { path = "crates/agents" }
assembly   = { path = "crates/assembly", default-features = false }
daemon     = { path = "daemon" }
rpc-client = { path = "tests/rpc_client" }
live = { path = "tests/live" }
mcp-oauth-mock = { path = "tests/fixtures/mcp_oauth_mock" }

# Debug builds keep line tables for the workspace and no debug info for
# dependencies: backtraces still name file and line, and with well over a
# hundred test binaries each linking the whole dependency graph, full debug
# info is most of what `target/` holds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `release` is the build that ships: sized for many instances per host and for
# embedded boards. `opt-level = "s"` with fat LTO gives an 11 MB `agixd`;
# `opt-level = 3` doubles that, almost all of it generic code (std, tokio,
# serde) inlined at every use, for about a tenth less of the daemon's own time
# per turn (`tests/live/tests/turn_throughput.rs`) — milliseconds against a
# model call's seconds. `"z"` is a third smaller again and about two thirds
# slower. `lto` is `fat` because the crates share most of their generic
# instantiations and only whole-program optimisation folds the copies.
#
# A panic aborts the process instead of unwinding, which also drops 3 MB of
# unwind tables: the hook `base::crash` installs stops the commands it started
# and writes a crash record first, and a supervisor restarts it
# (docs/ARCHITECTURE.md §1.3).
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"

# Only when asked for: twice the size, a little faster, and a panic inside a
# task ends that task rather than the process.
#
#     cargo build --profile release-fast -p daemon --bin agixd
[profile.release-fast]
inherits = "release"
opt-level = 3
panic = "unwind"
