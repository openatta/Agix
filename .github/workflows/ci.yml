name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Incremental caching buys nothing on a fresh runner and costs disk, which
  # is the resource this workspace is short of — a clean build is ~13 GB
  # because every integration test file links the whole dependency graph.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The wasm-host tests build a real component from
          # `tests/fixtures/wasm_echo_plugin` — the claims they check are about
          # the whole path to a guest, so there is no version of them that does
          # not need the target.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      # Both are clean today, and the gate is the only thing that keeps them
      # that way. Formatting is checked first because it needs no build.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # A second daemon, built with no script engine at all. It needs a
      # target directory of its own: both builds produce a binary called
      # `agixd`, so building this one into `target/` would replace the
      # daemon every other spawned case is meant to run against.
      #
      # What it buys is the only way to observe a build that has no carrier.
      # A test running inside a build that has one cannot answer what the
      # other does with a `scripts` section — see `docs/testing_scripts.md`,
      # which lists exactly that as outside the script carrier's own net.
      - name: build a daemon with no carrier
        run: CARGO_TARGET_DIR=${{ github.workspace }}/target/no-carrier cargo build -p daemon --no-default-features

      # And a third, carrying WebAssembly. Same reason as above — one binary
      # called `agixd` per target directory — and the same shape of claim:
      # whether a component a package shipped is ever called cannot be asked
      # from inside a build that has no engine to call it with. `plugin-compile`
      # rather than plain `plugins` because installing a package with
      # components compiles them, and without the in-process compiler that
      # work goes looking for `agix-plugin-compile`.
      - name: build a daemon with the plugin carrier
        run: CARGO_TARGET_DIR=${{ github.workspace }}/target/plugins cargo build -p daemon --no-default-features --features plugin-compile

      # The ignored set is where the slow cases live — a real daemon, a real
      # MCP server over stdio, the schema the documents are generated from.
      # They are ignored because they are slow, not because they are optional,
      # and nothing else runs them.
      #
      # `--all-targets` excludes doc tests, which is the point: a ```ignore
      # block in a doc comment is illustration, not a test somebody forgot to
      # switch on, and it does not compile on its own.
      - name: test (ignored)
        env:
          AGIX_TEST_DAEMON_BIN_NO_CARRIER: ${{ github.workspace }}/target/no-carrier/debug/agixd
          AGIX_TEST_DAEMON_BIN_PLUGINS: ${{ github.workspace }}/target/plugins/debug/agixd
        run: cargo test --workspace --all-targets -- --ignored

  carriers:
    # A build carries one extension carrier, or none. Each configuration is a
    # build nobody makes by accident, so each is one nobody would notice
    # breaking.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tested, not just checked. Each of these two configurations compiles
      # in daemon tests that no other configuration does — the
      # plugins-disabled RPC answers here, the plugin-owned scene and
      # `plugin.reload` under the carrier — and while this job only built
      # them, those tests had never been run anywhere.
      - name: no carrier
        run: cargo test -p daemon --no-default-features

      - name: plugin carrier
        run: cargo test -p daemon --no-default-features --features plugins

      # The package layer without any carrier: `plugin.*` works, nothing runs.
      # A build worth checking on its own because it is the one that proves
      # the split — package management that needs no runtime. Checked rather
      # than tested because every test gated on the package layer also
      # compiles into the default build, which the `test` job runs.
      - name: packages without a carrier
        run: cargo check -p daemon --no-default-features --features plugin-packages

      # `precompile_plugin` must not go looking for `agix-plugin-compile` on
      # behalf of components a package never declared. The claim only bites
      # without the in-process compiler, so this is where it is checked; the
      # rest of this crate's suite needs the compiler to load its fixtures.
      - name: a package with no components needs no compiler
        run: cargo test -p plugin-host --no-default-features precompile_tests

      - name: both carriers must not compile
        run: |
          if cargo check -p daemon --features plugins 2>/dev/null; then
            echo "the two carriers compiled together; the guard in daemon/src/lib.rs is gone"
            exit 1
          fi

      # The OTLP recorder is compiled out of every default build — the SDK is
      # a large dependency tree and the file recorder is what makes a run
      # debuggable out of the box — so nothing else builds this module at all.
      # It reads the same event payloads the file recorder does, which is
      # exactly why it rots silently when one of them grows a field.
      - name: otel recorder
        run: cargo check -p daemon --features otel

      # The OS sandbox is optional too, and independent of the carriers. Its
      # backends and the ~30 tests that drive them are compiled out of every
      # default build, so this job is the only place they are built at all —
      # and Linux is the platform whose backend nobody develops on.
      - name: sandbox backend
        run: cargo check -p daemon --features sandbox

      - name: sandbox tests
        run: cargo test -p base --features sandbox
