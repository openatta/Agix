name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Incremental caching buys nothing on a fresh runner and costs disk, which
  # is the resource this workspace is short of — a clean build is ~13 GB
  # because every integration test file links the whole dependency graph.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Both are clean today, and the gate is the only thing that keeps them
      # that way. Formatting is checked first because it needs no build.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # A second daemon, built with no script engine at all. It needs a
      # target directory of its own: both builds produce a binary called
      # `agixd`, so building this one into `target/` would replace the
      # daemon every other spawned case is meant to run against.
      #
      # What it buys is the only way to observe a build that has no carrier.
      # A test running inside a build that has one cannot answer what the
      # other does with a `scripts` section — see `tests/testing_scripts.md`,
      # which lists exactly that as outside the script carrier's own net.
      - name: build a daemon with no carrier
        run: CARGO_TARGET_DIR=${{ github.workspace }}/target/no-carrier cargo build -p daemon --no-default-features --features full

      # The kernel alone: no MCP, sub-agents, skills, web tools, WebSocket,
      # carrier or package layer. `minimal_tier` runs a session against it.
      - name: build a minimal daemon
        run: CARGO_TARGET_DIR=${{ github.workspace }}/target/minimal cargo build -p daemon --no-default-features

      # The ignored set is where the slow cases live — a real daemon, a real
      # MCP server over stdio, the schema the documents are generated from.
      # They are ignored because they are slow, not because they are optional,
      # and nothing else runs them.
      #
      # `--all-targets` excludes doc tests, which is the point: a ```ignore
      # block in a doc comment is illustration, not a test somebody forgot to
      # switch on, and it does not compile on its own.
      - name: test (ignored)
        env:
          AGIX_TEST_DAEMON_BIN_NO_CARRIER: ${{ github.workspace }}/target/no-carrier/debug/agixd
          AGIX_TEST_DAEMON_BIN_MINIMAL: ${{ github.workspace }}/target/minimal/debug/agixd
        run: cargo test --workspace --all-targets -- --ignored

  carriers:
    # Builds with and without the script carrier and the package layer. Each
    # configuration is a build nobody makes by accident, so each is one nobody
    # would notice breaking.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tested, not just checked: the plugins-disabled RPC answers compile
      # into no other configuration.
      - name: no carrier
        run: cargo test -p daemon --no-default-features --features full

      # The middle tier, with the carrier and without.
      - name: coding tier
        run: |
          cargo check -p daemon --no-default-features --features coding
          cargo check -p daemon --no-default-features --features coding,scripts

      # The package layer without the script carrier. Checked rather than
      # tested because every test gated on the package layer also compiles
      # into the default build, which the `test` job runs.
      - name: packages without a carrier
        run: cargo check -p daemon --no-default-features --features full,plugin-packages

      # The OTLP recorder is compiled out of every default build — the SDK is
      # a large dependency tree and the file recorder is what makes a run
      # debuggable out of the box — so nothing else builds this module at all.
      # It reads the same event payloads the file recorder does, which is
      # exactly why it rots silently when one of them grows a field.
      - name: otel recorder
        run: cargo check -p daemon --features otel

      # The OS sandbox is on in the default build; this is the build without
      # it, whose `PlatformSandbox` confines nothing.
      - name: no sandbox backend
        run: cargo check -p platform

      # The contract crate has no HTTP stack at all — it is what a crate that
      # only implements the traits depends on — and this machine's providers
      # can go without one. The graph checks are the claim.
      - name: no http stack
        run: |
          cargo test -p base
          if cargo tree -p base -e normal | grep -Eq '\b(reqwest|rustls|hyper) v'; then
            echo "base links an HTTP stack"
            exit 1
          fi
          cargo test -p platform --no-default-features
          if cargo tree -p platform --no-default-features -e normal | grep -Eq '\b(reqwest|rustls|hyper) v'; then
            echo "platform without http still links an HTTP stack"
            exit 1
          fi
