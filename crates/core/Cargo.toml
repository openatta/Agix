[package]
name = "base"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — foundation types, traits, and context"

[dependencies]
tokio         = { workspace = true }
tokio-util    = { workspace = true }
futures       = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
schemars      = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
uuid          = { workspace = true }
time          = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
regex         = { workspace = true }
base64        = { workspace = true }
bs58          = { workspace = true }
toml          = { workspace = true }
walkdir       = { workspace = true }
ignore        = { workspace = true }
url           = { workspace = true }
reqwest       = { workspace = true }
serde_yaml    = "0.9"

[target.'cfg(unix)'.dependencies]
libc          = { workspace = true }

[features]
default = []

# The OS process sandbox for `Bash` — macOS `sandbox-exec`, Linux
# `bubblewrap`. Off by default: it constrains the commands the *model* runs,
# which is defence in depth on a machine whose owner is sitting at it, and a
# boundary only where the agent acts on someone else's behalf. A deployment
# that needs the boundary asks for it.
#
# Off means no backend is compiled at all: `PlatformSandbox` says it cannot
# confine anything, and `sandbox.require_enforcement` — which exists to refuse
# rather than run unconstrained — refuses every command, naming this feature.
# The contract, the policy type and the credential deny-read list stay either
# way; the last of those is a data-exfiltration guard the command classifier
# uses whether or not anything is sandboxed.
sandbox = []
# Enable multi-agent team coordination mode
team-mode = []
# Enable plugin marketplace (remote registry + dependency resolution)
plugin-marketplace = []
# Enable experimental agent routing (model selection by task type)
experimental-agent = []

[dev-dependencies]
tempfile = { workspace = true }
