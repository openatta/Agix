[package]
name = "compaction"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — context compaction (message grouping, cleanup, caching)"

[dependencies]
base          = { workspace = true }
# For the single shared tiktoken-based token estimator (`model::tokens`).
# `model` depends on `base` only, so this stays acyclic.
model         = { workspace = true }
tokio         = { workspace = true }
tokio-util    = { workspace = true }
async-trait   = { workspace = true }
tracing       = { workspace = true }
futures       = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` gives paused-clock tests, so the summarization-timeout test runs
# instantly instead of sleeping for real.
tokio = { workspace = true, features = ["test-util"] }
