async-trait   = { workspace = true }
futures       = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc        = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
