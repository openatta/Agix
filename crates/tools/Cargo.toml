[package]
name = "tools"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — built-in tool implementations"
autotests    = false

[dependencies]
base          = { workspace = true }
platform      = { workspace = true }
permissions   = { workspace = true }
tokio         = { workspace = true }
tokio-util    = { workspace = true }
futures       = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
schemars      = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
uuid          = { workspace = true }
regex         = { workspace = true }
globset       = { workspace = true }
html2text     = { workspace = true, optional = true }
jsonschema    = { workspace = true, optional = true }
ignore        = { workspace = true }
similar       = { workspace = true }
base64        = { workspace = true }
time = { workspace = true }

[features]
default = ["web", "structured-output"]
# WebFetch and WebSearch.
web = ["dep:html2text"]
# StructuredOutput, which validates the model's final answer against a schema.
structured-output = ["dep:jsonschema"]

[dev-dependencies]
libc = { workspace = true }
platform = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[test]]
name = "integration"
path = "tests/integration.rs"
