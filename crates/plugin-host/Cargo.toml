[package]
name = "plugin-host"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — binds installed plugins to the engine's PluginHost seam"

[dependencies]
base       = { workspace = true }
hooks      = { workspace = true }
plugin     = { workspace = true }
runtime    = { workspace = true }
wasm-host  = { workspace = true }
anyhow     = { workspace = true }
futures    = { workspace = true }
jsonschema = { workspace = true }
async-trait = { workspace = true }
tokio      = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }

[features]
default = ["compile"]
# Compile plugin components in-process. Off means the work goes to
# `agix-plugin-compile`, and this build links no WebAssembly compiler.
compile = ["wasm-host/compile"]

[dev-dependencies]
tempfile = { workspace = true }
