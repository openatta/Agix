[package]
name = "wasm-host"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — wasmtime host for WASM component plugins"

[dependencies]
base        = { workspace = true }
async-trait = { workspace = true }
serde_json  = { workspace = true }
plugin   = { workspace = true }
anyhow   = { workspace = true }
hex      = { workspace = true }
sha2     = { workspace = true }
tokio    = { workspace = true }
tokio-util = { workspace = true }
tracing  = { workspace = true }
wasmtime = { version = "47", default-features = false, features = ["runtime", "component-model", "async", "std", "anyhow", "gc", "gc-drc", "gc-null"] }
wasmtime-wasi = "47"

[features]
default = ["compile"]
# Link Cranelift, so this build can turn a `.wasm` into a `.cwasm`.
#
# With it off, `WasmEngine` can only load artifacts something else compiled:
# `Component::new` does not exist, so "this process cannot compile WebAssembly"
# is a fact the type system enforces rather than a policy someone maintains.
#
# Nothing else may go here. Every wasmtime feature outside this line is
# shared by both builds on purpose: the AOT compatibility hash derives from
# the engine configuration, so a feature present on one side and absent on
# the other would make every artifact miss — and in a runtime-only build a
# miss is a refusal to load. `tests/scripts/locked_build.sh` checks the two
# hashes actually agree rather than trusting this comment.
compile = ["wasmtime/cranelift"]

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }
wat      = "1"
