[package]
name = "assembly"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — the assembly: modules into sessions, sessions into a pool, provider routing"

[dependencies]
base          = { workspace = true }
runtime       = { workspace = true }
agents        = { workspace = true, optional = true }
model         = { workspace = true }
mcp           = { workspace = true, optional = true }
permissions   = { workspace = true }
libc          = { workspace = true }
scene         = { workspace = true }
history       = { workspace = true }
hooks         = { workspace = true }
session       = { workspace = true }
plugin        = { workspace = true, optional = true }
script-host   = { workspace = true, optional = true }
skills        = { workspace = true, optional = true }
tools         = { workspace = true }
tokio         = { workspace = true, features = ["full"] }
tokio-util    = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
async-trait   = { workspace = true }
reqwest       = { workspace = true }
time          = { workspace = true }
futures       = { workspace = true }
telemetry     = { workspace = true }
notify        = { workspace = true }
url           = { workspace = true }
zip           = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
base64        = { workspace = true }

# Optional: OpenTelemetry OTLP export (gated by "otel" feature). Lives here,
# not in `telemetry`, because that crate never talks to the network itself —
# see `telemetry_otel.rs`.
opentelemetry      = { version = "0.27", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk  = { version = "0.27", default-features = false, features = ["trace", "metrics", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto"], optional = true }
# The OTLP/HTTP exporter's client trait. Implemented here over the workspace's
# `reqwest` rather than through `opentelemetry-otlp/reqwest-client`, which
# would pull in a second major version of reqwest.
opentelemetry-http = { version = "0.27", default-features = false, optional = true }
tonic              = { version = "0.12", optional = true }

tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
compaction = { workspace = true }

[features]
# ── The script carrier and the package layer ────────────────────────────
#
#     cargo build -p daemon                                          # QuickJS + packages
#     cargo build -p daemon --no-default-features --features full    # neither
default = ["scripts", "plugin-packages", "mcp", "agents", "skills", "sandbox"]

# The modules a session can be assembled with; see `modules.rs`.
mcp = ["dep:mcp"]
# The WebSocket listener.
ws = ["dep:tokio-tungstenite"]
agents = ["dep:agents"]
skills = ["dep:skills"]

# The script carrier. Off means no JavaScript engine is compiled into the
# binary at all, and a `scripts` section in settings.json is refused at startup
# rather than silently ignored — a script that quietly never runs is worse than
# one that fails to load.
scripts = ["dep:script-host"]

# The package layer: manifest, fetch, checksum, unpack, versioned cache,
# disclosure, enable state. It runs nothing itself: a package's `[[mcp]]`
# servers, `[[script]]` bindings, scene directory and agent types are honored
# through the parts of the engine that already exist.
plugin-packages = ["dep:plugin"]

# ── Everything else ─────────────────────────────────────────────────────

# The OS process sandbox around `Bash` — see `base`'s feature of the same name.
# On by default: an unattended session runs shell commands only when the
# sandbox holds them. Independent of the script carrier: it constrains the
# model's own shell commands, not anybody's extensions.
sandbox = ["base/sandbox"]

# Fan session telemetry out to an OTLP collector in addition to the per-session
# JSONL file. Off by default: the OTLP SDK is a large dependency tree and the
# file recorder is what makes a run debuggable out of the box.
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-http", "tonic"]
