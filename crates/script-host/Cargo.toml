[package]
name = "script-host"
version.workspace = true
edition.workspace = true
license.workspace = true

# Note: `rquickjs` requires Rust 1.87, above the workspace's declared 1.80.
# That raises the floor only for builds that turn this carrier on — it is an
# optional dependency of `daemon` behind the `scripts` feature, and a build
# without it is unaffected.

[dependencies]
base        = { workspace = true }
runtime     = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
rquickjs    = { workspace = true }

[dev-dependencies]
tokio-util  = { workspace = true }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
