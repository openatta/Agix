[package]
name = "plugin-compiler"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — compiles plugin components ahead of time"

[lib]
name = "plugin_compiler"
path = "src/lib.rs"

[[bin]]
name = "agix-plugin-compile"
path = "src/main.rs"

[dependencies]
anyhow    = { workspace = true }
plugin    = { workspace = true }
# Explicitly with the compiler: this binary exists to have one.
wasm-host = { workspace = true, features = ["compile"] }

[dev-dependencies]
tempfile  = { workspace = true }
