[package]
name = "runtime"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix — agent runtime (turn loop, Agent + Builder)"

[dependencies]
base          = { workspace = true }
platform      = { workspace = true }
permissions   = { workspace = true }
history       = { workspace = true }
tools         = { workspace = true }
telemetry     = { workspace = true }
hooks         = { workspace = true }
compaction    = { workspace = true }
session       = { workspace = true }
scene         = { workspace = true }
tokio         = { workspace = true }
tokio-util    = { workspace = true }
futures       = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
uuid          = { workspace = true }
time          = { workspace = true }
schemars = { workspace = true }
notify        = { workspace = true }
# Attachment images arrive as raw bytes (Attachment::File) and must reach the
# API as base64 — see `resolve_attachments` in turn/attachments.rs.
base64        = { workspace = true }
# RunCode: the model's programs, run in an embedded QuickJS — see docs/ptc.md.
ptc           = { workspace = true, optional = true }

[features]
# The tool groups the kernel registers without being asked: off in the minimal
# build (`--no-default-features`), on everywhere else.
default = ["web", "structured-output", "ptc"]
web = ["tools/web"]
ptc = ["dep:ptc"]
structured-output = ["tools/structured-output"]

[dev-dependencies]
url      = { workspace = true }
tempfile = { workspace = true }
model    = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
