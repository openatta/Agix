[package]
name = "daemon"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix daemon — JSON-RPC 2.0 over Unix socket / TCP, sample application"
autotests    = false

[[bin]]
name = "agixd"
path = "src/main.rs"

[dependencies]
base          = { workspace = true }
platform      = { workspace = true }
runtime       = { workspace = true }
model         = { workspace = true }
permissions   = { workspace = true }
scene         = { workspace = true }
history       = { workspace = true }
hooks         = { workspace = true }
session       = { workspace = true }
tools         = { workspace = true }
tokio         = { workspace = true, features = ["full"] }
tokio-util    = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait   = { workspace = true }
lexopt        = "0.3"
reqwest       = { workspace = true }
time          = { workspace = true }
futures       = { workspace = true }
telemetry     = { workspace = true }
notify        = { workspace = true }
url           = { workspace = true }
assembly      = { workspace = true }
# Only for the extension-point docs test, which reads the carrier's bindable points.
script-host   = { workspace = true, optional = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
agents      = { workspace = true }
mcp         = { workspace = true }
skills      = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
compaction = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }
mcp-oauth-mock = { workspace = true }
guards = { workspace = true }

[features]
# The same switches as `assembly`'s, where they are documented; the binary
# only forwards them.
#
# The tiers. The script carrier (`scripts`) and the package layer
# (`plugin-packages`) are chosen separately:
#
#     cargo build -p daemon                                            # full + scripts + packages
#     cargo build -p daemon --no-default-features --features coding,scripts
#     cargo build -p daemon --no-default-features                      # minimal: the kernel
default = ["full", "scripts", "plugin-packages", "sandbox"]
coding = ["mcp", "agents", "skills", "web", "structured-output", "ptc"]
full = ["coding", "ws"]
mcp = ["assembly/mcp"]
agents = ["assembly/agents"]
skills = ["assembly/skills"]
ws = ["assembly/ws"]
web = ["runtime/web"]
structured-output = ["runtime/structured-output"]
# RunCode (docs/ptc.md). Independent of the script carrier, though both run QuickJS.
ptc = ["runtime/ptc"]
scripts = ["assembly/scripts", "dep:script-host"]
plugin-packages = ["assembly/plugin-packages"]
sandbox = ["assembly/sandbox"]
otel = ["assembly/otel"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "mcp_oauth_logs"
path = "tests/mcp_oauth_logs.rs"
