[package]
name = "daemon"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = false
description  = "Agix daemon — JSON-RPC 2.0 over Unix socket / TCP, sample application"

[[bin]]
name = "agixd"
path = "src/main.rs"

[dependencies]
base          = { workspace = true }
runtime       = { workspace = true }
agents        = { workspace = true }
model         = { workspace = true }
mcp           = { workspace = true }
permissions   = { workspace = true }
scene         = { workspace = true }
history       = { workspace = true }
hooks         = { workspace = true }
session       = { workspace = true }
skills        = { workspace = true }
tools         = { workspace = true, features = ["web", "structured-output"] }
tokio         = { workspace = true, features = ["full"] }
tokio-util    = { workspace = true }
tokio-tungstenite = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait   = { workspace = true }
lexopt        = "0.3"
reqwest       = { workspace = true }
time          = { workspace = true }
futures       = { workspace = true }
telemetry     = { workspace = true }
notify        = { workspace = true }
url           = { workspace = true }
assembly      = { workspace = true }
# Only for the extension-point docs test, which reads the carrier's bindable points.
script-host   = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
libc = { workspace = true }
compaction = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }

[features]
# The same switches as `assembly`'s, where they are documented; the binary
# only forwards them.
default = ["scripts", "plugin-packages"]
scripts = ["assembly/scripts", "dep:script-host"]
plugin-packages = ["assembly/plugin-packages"]
plugins = ["assembly/plugins"]
plugin-compile = ["assembly/plugin-compile"]
sandbox = ["assembly/sandbox"]
otel = ["assembly/otel"]
