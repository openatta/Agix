[package]
name = "mcp-toy-server"
version.workspace = true
edition.workspace = true
publish = false
description = "Minimal stdio MCP server used only as a test fixture (tests/fixtures/template_project's mcp_servers.demo points at it)"

[[bin]]
name = "mcp-toy-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
