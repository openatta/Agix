[package]
name = "mcp-toy-server"
version.workspace = true
edition.workspace = true
publish = false
description = "MCP server used only as a test fixture: stdio or streamable HTTP, tools, resources and prompts (tests/fixtures/template_project and tests/live point at it)"

[[bin]]
name = "mcp-toy-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
