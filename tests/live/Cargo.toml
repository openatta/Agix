[package]
name = "live"
version.workspace = true
edition.workspace = true
publish = false
description = "Runs a scenario against a daemon — in this process or a spawned one — over the real RPC surface, with a scripted or a real model"
autotests = false

[dependencies]
daemon      = { workspace = true }
rpc-client  = { workspace = true }
base        = { workspace = true }
model       = { workspace = true }
scene       = { workspace = true }
runtime     = { workspace = true }
history     = { workspace = true }
tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
url         = { workspace = true }
tempfile    = { workspace = true }
reqwest     = { workspace = true }

[dev-dependencies]
# For the demo package's zip: one packer, shared, rather than a second copy
# of "walk a directory into an archive and hash it".
test-runner = { path = "../runner" }
demo-rust-plugin = { workspace = true }

[features]
# The live tier: cases that talk to a real model, with the credentials in the
# workspace's `.env`. Off by default so `cargo test --workspace` stays offline.
real-model = []

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "real_model"
path = "tests/real_model.rs"
required-features = ["real-model"]

# Its own binary: a benchmark against a second harness, run on its own with
# its own environment (`AGIX_DSH_BIN`, `AGIX_COMPARE_CASES`).
[[test]]
name = "compare_dsh"
path = "tests/compare_dsh.rs"
required-features = ["real-model"]
