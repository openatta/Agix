[package]
name = "test-runner"
version.workspace = true
edition.workspace = true
publish = false
description = "Agix test runner — executes .test scenario files against Agent API or Daemon"
autotests = false

[lib]
name = "test_runner"
path = "src/lib.rs"

[dependencies]
rpc-client    = { workspace = true }
daemon        = { workspace = true }
base          = { workspace = true }
runtime       = { workspace = true }
agents        = { workspace = true }
model         = { workspace = true }
scene         = { workspace = true }
telemetry     = { workspace = true }
tools         = { workspace = true, features = ["web", "structured-output"] }
mcp           = { workspace = true }
permissions   = { workspace = true }
skills        = { workspace = true }
hooks         = { workspace = true }
compaction    = { workspace = true }
history       = { workspace = true }
tokio         = { workspace = true, features = ["full"] }
tokio-util    = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
async-trait   = { workspace = true }
futures       = { workspace = true }
anyhow        = { workspace = true }
url           = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
clap          = { version = "4", features = ["derive"] }
shellexpand   = "3"
zip           = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
time          = { workspace = true }
script-host   = { workspace = true }

[dev-dependencies]
platform = { workspace = true }
tempfile      = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
